# Install as /etc/nginx/sites-available/masfah.conf
# Enable with: ln -s /etc/nginx/sites-available/masfah.conf /etc/nginx/sites-enabled/masfah.conf
# Replace the certificate paths after Certbot has issued the certificate.

upstream masfah_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name msaffah.ae mosaffah.ae icad.ae;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name msaffah.ae mosaffah.ae icad.ae;

    ssl_certificate /etc/letsencrypt/live/msaffah.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msaffah.ae/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://masfah_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
